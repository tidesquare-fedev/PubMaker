<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>프로모션 pc</title>
  </head>
  <body>
    <!-- 시작 -->
    <div
      class="new-pb-container event-wrap"
      style="position: relative; width: 100%; max-width: 1200px"
    >
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/202503/60137/pc_01.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
        <div
          style="
            position: absolute;
            width: 60.28%;
            left: 21.2%;
            aspect-ratio: 723/409;
            top: 68.37%;
            overflow: hidden;
          "
        >
          <div
            class="emped-vide"
            style="
              position: absolute;
              width: 100%;
              height: 100%;
              top: 50%;
              left: 0;
              right: 0;
              transform: translateY(-50%);
            "
          >
            <video
              autoplay
              loop
              muted
              playsinline
              style="width: 100%; height: 100%"
            >
              <source
                src="https://cdns.tourvis.com/promotion/202503/60137/movie.mp4"
                type="video/mp4"
              />
            </video>
          </div>
        </div>
      </div>
      <div
        style="position: relative; padding: 0 16.66667%; background: #e9f1fc"
      >
        <img
          src="https://cdns.tourvis.com/promotion/202503/60137/mo_02.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
        <a
          data-map-anchor="true"
          style="
            position: absolute;
            bottom: 11.62%;
            left: 19.97%;
            width: 59.87%;
            height: 12.26%;
            text-indent: -9999px;
            font-size: 0;
          "
          href="javascript:promoFixPop('7C');"
          >항공권 예약하기</a
        >
      </div>
    </div>
    <!-- 끝 -->
  </body>
</html>
