<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>프로모션 pc</title>
    <style>
      .tab-switch .tab-mn {
        height: 50px;
      }
      .tab-switch .tab-mn ul {
        display: flex;
        align-items: center;
        justify-content: space-around;
        height: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: hidden;
      }
      .tab-switch .tab-mn li {
        width: 100%;
        height: 100%;
        text-align: center;
      }
      .tab-switch .tab-mn li a {
        display: flex;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        color: #000;
        font-weight: 400;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .tab-switch .tab-mn li.on a {
        font-weight: 700;
      }
      .tab-switch .tabCont {
        display: none;
      }
      .tab-switch .tabCont.on {
        display: block;
      }
      .tab-switch.is-image .tab-mn {
        height: auto;
      }
      .tab-switch.is-image .tab-mn li a {
        display: block;
      }
      .tab-switch.is-image .tab-mn img {
        display: block;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- 시작 -->
    <div
      class="new-pb-container event-wrap"
      style="position: relative; width: 100%; max-width: 1200px; margin: 0 auto"
    >
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/test/tes_01.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
      </div>
      <div class="tab-switch tab-switch-1 is-image">
        <div class="tab-mn">
          <ul>
            <li class="on" data-tabnum="0">
              <a href="#" class="tabBtn"
                ><img
                  src="https://cdns.tourvis.com/promotion/test/tab_01_on.jpg"
                  alt="항공"
              /></a>
            </li>
            <li data-tabnum="1">
              <a href="#" class="tabBtn"
                ><img
                  src="https://cdns.tourvis.com/promotion/test/tab_02_off.jpg"
                  alt="투어티켓"
              /></a>
            </li>
          </ul>
        </div>
        <div class="tabCont on">
          <div style="position: relative">
            <img
              src="https://cdns.tourvis.com/promotion/test/tes_03.jpg"
              alt=""
              border="0"
              style="display: block; width: 100%"
            />
          </div>
        </div>
        <div class="tabCont">
          <div style="position: relative">
            <img
              src="https://cdns.tourvis.com/promotion/test/tes_05.jpg"
              alt=""
              border="0"
              style="display: block; width: 100%"
            />
          </div>
        </div>
      </div>
    </div>
    <!-- 끝 -->
    <script>
      (function () {
        var groups = document.querySelectorAll(".tab-switch");

        function swapOnOff(src, state) {
          return String(src || "").replace(
            /_(on|off)(\.[A-Za-z0-9]+)(\?.*)?$/,
            "_" + state + "$2$3",
          );
        }

        Array.prototype.forEach.call(groups, function (group) {
          var items = group.querySelectorAll(".tab-mn li");
          var conts = group.querySelectorAll(".tabCont");
          if (!items.length || !conts.length) return;

          function activate(index) {
            Array.prototype.forEach.call(items, function (li, i) {
              var on = i === index;
              if (on) li.classList.add("on");
              else li.classList.remove("on");
              var img = li.querySelector("img");
              if (!img) return;
              var src = img.getAttribute("src");
              var next = swapOnOff(src, on ? "on" : "off");
              if (next !== src) img.setAttribute("src", next);
            });
            for (var i = 0; i < conts.length; i++) {
              if (i === index) conts[i].classList.add("on");
              else conts[i].classList.remove("on");
            }
          }

          Array.prototype.forEach.call(items, function (li, i) {
            var link = li.querySelector("a");
            if (!link) return;
            link.addEventListener("click", function (e) {
              e.preventDefault();
              activate(i);
            });
          });
        });
      })();
    </script>
  </body>
</html>
