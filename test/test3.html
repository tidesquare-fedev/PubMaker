<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>프로모션 pc</title>
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <!-- 시작 -->
    <div
      class="new-pb-container event-wrap"
      style="position: relative; width: 100%; max-width: 750px"
    >
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/test/q_4_01.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
      </div>
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/test/q_4_02.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
        <div
          class="section"
          id="a"
          style="position: absolute; left: 0; top: 0%; width: 100%; height: 1px"
        ></div>
        <a
          data-map-anchor="true"
          style="
            position: absolute;
            bottom: 93.9%;
            left: 0%;
            width: 49.69%;
            height: 6.1%;
            text-indent: -9999px;
            font-size: 0;
          "
          href="#a"
          >탭 이동</a
        >
        <a
          data-map-anchor="true"
          style="
            position: absolute;
            bottom: 93.95%;
            left: 50.01%;
            width: 49.99%;
            height: 6.05%;
            text-indent: -9999px;
            font-size: 0;
          "
          href="#b"
          >탭 이동</a
        >
      </div>
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/test/q_4_03.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
        <div
          class="section"
          id="b"
          style="position: absolute; left: 0; top: 0%; width: 100%; height: 1px"
        ></div>
        <a
          data-map-anchor="true"
          style="
            position: absolute;
            bottom: 89.52%;
            left: 0.03%;
            width: 49.84%;
            height: 10.48%;
            text-indent: -9999px;
            font-size: 0;
          "
          href="#a"
          >탭 이동</a
        >
        <a
          data-map-anchor="true"
          style="
            position: absolute;
            bottom: 89.36%;
            left: 49.86%;
            width: 50.14%;
            height: 10.64%;
            text-indent: -9999px;
            font-size: 0;
          "
          href="#b"
          >탭 이동</a
        >
      </div>
      <div style="position: relative">
        <img
          src="https://cdns.tourvis.com/promotion/test/q_4_04.jpg"
          alt=""
          border="0"
          style="display: block; width: 100%"
        />
      </div>
    </div>
    <!-- 끝 -->
  </body>
</html>
